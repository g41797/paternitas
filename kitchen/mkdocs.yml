site_name: Paternitas
docs_dir: ./docs
site_dir: ../docs
site_description: Paternitas
repo_url: https://github.com/g41797/paternitas/
repo_name: Paternitas on GitHub

theme:
  name: material
  logo: assets/logo/favicon.svg
  favicon: assets/logo/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - navigation.footer
nav:
  - Home: index.md
  - Examples:
      - examples/001-set_type_id_and_recover.md
      - examples/002-mixed_list.md
      - examples/003-timeout_list.md
      - examples/004-handler_map.md
      - examples/005-large_struct_in_union.md
      - examples/006-anchor_chain.md

hooks:
  - hooks/count_lines.py

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

copyright: >
  Copyright &copy; 2026 g41797
