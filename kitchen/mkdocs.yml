site_name: Paternitas
docs_dir: ./docs
site_dir: ../docs
site_description: Paternitas
repo_url: https://github.com/g41797/paternitas/
repo_name: Paternitas on GitHub

theme:
  name: material
  logo: assets/logo/favicon.svg
  favicon: assets/logo/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - navigation.footer
nav:
  - Home: index.md
  - How to prevent the linked list footgun:
      - In short: introduction.md
      - Intrusive lists: background/intrusive.md
      - Type-erased lists: background/type-erased.md
      - Are you my Parent?: background/parent-problem.md
  - Guides:
      - Which page you need: guides/choose.md
      - Migrate your code: guides/lists.md
      - The setTypeId rule: guides/set-type-id.md
      - Several types in one list: guides/mixed-list.md
      - Queues, maps, union fields: guides/any.md
      - Type ids, listless and nodeless: guides/type-ids.md
      - Your own container: guides/containers.md
  - Examples:
      - 001 One struct, one list: examples/001-set_type_id_and_recover.md
      - 002 Two types, one list: examples/002-mixed_list.md
      - 003 Timeout list and a queue: examples/003-timeout_list.md
      - 004 Handler map: examples/004-handler_map.md
      - 005 Large struct in a union: examples/005-large_struct_in_union.md
      - 006 Your own stack: examples/006-anchor_chain.md
      - 007 Type id without a node: examples/007-type_id_without_node.md
  - Reference:
      - All the calls: reference/calls.md
      - Limits: reference/limits.md
      - Terms: reference/terms.md
      - Install: reference/install.md
      - Name and origin: reference/about.md
  - API docs: api.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - hooks/count_lines.py
  - hooks/new_tab_links.py

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

copyright: >
  Copyright &copy; 2026 g41797
